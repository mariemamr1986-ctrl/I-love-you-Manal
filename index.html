
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love Manal 💜</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Trebuchet MS", sans-serif;
      background: linear-gradient(135deg, #f5eaff, #e1c4ff, #f9e6ff);
      color: #6b21a8;
    }

    .card {
      width: min(90%, 430px);
      padding: 40px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      box-shadow: 0 15px 50px rgba(123, 63, 170, 0.2);
      position: relative;
      z-index: 2;
      animation: appear 1.2s ease;
    }

    .sparkle {
      font-size: 25px;
      animation: twinkle 1.5s infinite alternate;
    }

    .heart {
      font-size: 75px;
      display: block;
      margin: 15px 0;
      animation: heartbeat 1.2s infinite;
      filter: drop-shadow(0 5px 10px #d8a2ff);
    }

    h1 {
      font-size: clamp(30px, 8vw, 42px);
      margin-bottom: 12px;
      color: #8b35c9;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.7;
      color: #8855a8;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 13px 25px;
      border-radius: 50px;
      color: white;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px #c99aeb;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 20px #bb86e8;
    }

    #message {
      display: none;
      margin-top: 25px;
      line-height: 1.8;
      color: #7624a8;
      font-size: 17px;
      animation: appear 0.8s ease;
    }

    .signature {
      margin-top: 22px;
      font-size: 14px;
      color: #ad83c9;
    }

    .floating-heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 1;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes twinkle {
      from { opacity: 0.45; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.1); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      to {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="sparkle">✧･ﾟ: *✧･ﾟ:*</div>

    <span class="heart">💜</span>

    <h1>I Love Manal</h1>

    <p class="subtitle">
      A little website for someone<br>
      who deserves a little extra love ✨
    </p>

    <button onclick="showMessage()">
      Open your surprise 💌
    </button>

    <div id="message">
      You make the world a little brighter<br>
      and ordinary days a little more special. 🦋<br><br>
      Sending you endless love, hugs, and purple hearts! 💜🌷✨
    </div>

    <div class="signature">
      Made with ♡ just for you
    </div>
  </main>

  <script>
    function showMessage() {
      const message = document.getElementById("message");

      if (message.style.display === "block") {
        message.style.display = "none";
      } else {
        message.style.display = "block";
        createHearts(18);
      }
    }

    function createHearts(amount) {
      const emojis = ["💜", "💕", "💗", "✨", "🦋"];

      for (let i = 0; i < amount; i++) {
        const heart = document.createElement("span");

        heart.className = "floating-heart";
        heart.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (16 + Math.random() * 25) + "px";
        heart.style.animationDuration = (3 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        heart.addEventListener("animationend", () => {
          heart.remove();
        });
      }
    }

    setInterval(() => {
      createHearts(1);
    }, 900);
  </script>

</body>
</html>
